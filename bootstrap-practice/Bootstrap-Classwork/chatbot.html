<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Basic Chatbot</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body { background: #7fb2e5; }
		.chat-card { max-width: 100%; }
		.chat-messages { min-height: 100%; background: #f8fafc; }
		.message { max-width: 100%; border-radius: 1rem; }
		.bot-message { border-bottom-left-radius: .25rem; }
		.user-message { border-bottom-right-radius: .25rem; }
	</style>
</head>
<body>
	<main class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
		<section class="card chat-card w-100 shadow border-0">
			<header class="card-header bg-primary text-white d-flex align-items-center justify-content-between py-3">
				<div>
					<h1 class="h5 mb-0">Support Chatbot</h1>
					<small><span class="badge bg-success rounded-circle p-1">&nbsp;</span> Online</small>
				</div>
			</header>

			<div class="card-body chat-messages p-3">
				<div class="message bot-message bg-white shadow-sm p-3 mb-3">Hello! How can I help you today?</div>
				<div class="message user-message bg-primary text-white shadow-sm p-3 mb-3 ms-auto">I need help with my account.</div>
				<div class="message bot-message bg-white shadow-sm p-3">Sure, please tell me what you need help with.</div>
			</div>

			<footer class="card-footer bg-white p-3">
				<div class="input-group">
					<input class="form-control" type="text" placeholder="Type a message..." aria-label="Type a message">
					<button class="btn btn-primary" type="button">Send</button>
				</div>
			</footer>
		</section>
	</main>
</body>
</html>
