<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Elements</title>
</head>
<body>
    <!-- Paragraph with three span elements to highlight/label different parts -->
    <h1>Span Elements Example</h1>
    <p>My name is <span id="name">Pratham Shukla</span>, I am a <span id="role">Web Development Student</span>, and I am based in <span id="location">India</span>.</p>
</body>
</html>
