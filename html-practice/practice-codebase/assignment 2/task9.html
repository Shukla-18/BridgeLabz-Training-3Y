<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong and Em Combined</title>
</head>
<body>
    <!-- Paragraph using both strong and em for emphasis -->
    <h1>Emphasis Example</h1>
    <p>Web development is a <strong>highly valuable skill</strong> in today's digital world, and learning it can be <em>truly life-changing</em> for anyone willing to put in the effort.</p>
</body>
</html>
