<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
</head>
<body>

    <h1>Internship Application Form</h1>
    <h2><iframe width="560" height="315" src="https://www.youtube.com/embed/G3t1JkCqfVg?si=cSdRHU9mdUyxslgc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></h2>

    <form action="#" method="post" enctype="multipart/form-data">

       
        <fieldset>
            <legend>Personal Details</legend>

            <label for="fullName">Full Name:</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
            >
            <br><br>

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
            <br><br>

            <label for="phone">Phone:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input
                type="date"
                id="dob"
                name="dob"
                required
            >
            <br><br>

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </fieldset>

        <br>

        
        <fieldset>
            <legend>Gender</legend>

            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </fieldset>

        <br>

        
        <fieldset>
            <legend>Educational Details</legend>

            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="" disabled selected>Select your course</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="Mechanical">Mechanical</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Skills</legend>

            <input type="checkbox" id="Python" name="skills" value="Python">
            <label for="Python">Python</label>

            <input type="checkbox" id="Bash" name="skills" value="Bash">
            <label for="Bash">Bash</label>

            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="react" name="skills" value="React">
            <label for="react">React</label>
        </fieldset>
        <br>
        <fieldset>
            <legend>Internship Preference</legend>

            <input
                type="radio"
                id="remote"
                name="internshipPreference"
                value="Remote"
                required
            >
            <label for="remote">Remote</label>

            <input
                type="radio"
                id="onsite"
                name="internshipPreference"
                value="On-site"
            >
            <label for="onsite">On-site</label>

            <input
                type="radio"
                id="hybrid"
                name="internshipPreference"
                value="Hybrid"
            >
            <label for="hybrid">Hybrid</label>
        </fieldset>
        <br>
        <fieldset>
            <legend>Application Details</legend>

            <label for="resume">Upload Resume:</label>
            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,.doc,.docx"
                required
            >
            <br><br>

            <label for="coverLetter">Cover Letter:</label>
            <br>
            <textarea
                id="coverLetter"
                name="coverLetter"
                rows="6"
                cols="50"
                placeholder="Write your cover letter here..."
                required
            ></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
