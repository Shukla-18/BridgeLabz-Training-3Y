<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="box.css">
</head>
<body class="inline-page">
  <h1 class="inline-title">Hello, External CSS!</h1>

  <p class="inline-description">
    This paragraph is styled using external CSS.
  </p>

  <button class="inline-button">
    Click Me
  </button>

  <div class="box">
    <h2>CSS Box</h2>
    <p>This is a box created with HTML and styled in the external stylesheet.</p>
  </div>

  <div class="image-card">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"
         alt="Nature"
         class="image-card-image">
    
    <div class="image-card-overlay">
      <h3>Beautiful Nature</h3>
      <p>A peaceful mountain view</p>
      
    </div>
  </div>
</body>
</html>
