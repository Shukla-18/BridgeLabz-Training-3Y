 =================================================================================================================================================
<! box-sizing: content-box is the default value. The width and height properties include only the content. Border and padding are not included.  
 rem works on the basis of root font size. It is relative to the root element (html). 1rem = 16px (default font size of html)
 em works on the basis of parent font size. It is relative to the font size of its parent element. 1em = 16px (default font size of html)
 vw-Viewport Width
 vh-Viewport Height
==================================================================================================================================================
